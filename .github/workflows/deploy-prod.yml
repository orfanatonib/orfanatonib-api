name: Deploy Production Orfanato API

# Produção = Super Stack (EC2, docker compose, profile "orfanato"), NÃO ECS.
# O banco é o container `mysql` da própria stack; migrations rodam na EC2 com a imagem nova,
# depois de um dump verificado, via scripts/deploy/remote-deploy.sh (mesmo código do deploy local).

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só valida (build/push, env, dump verificado, status das migrations); não altera produção"
        type: boolean
        default: false

concurrency:
  group: deploy-production-orfanato
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR: 614946928663.dkr.ecr.us-east-1.amazonaws.com
  REPO: prod-orfanato-nib-api
  HEALTH_URL: https://orfanato-nib-api.rodolfo-silva.com/health

jobs:
  deploy:
    name: Build, Push e Deploy na Super Stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Testes unitários
        run: npx jest --runInBand --silent
        env:
          NODE_OPTIONS: --max-old-space-size=2048

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::614946928663:role/super-stack-prod-deploy-orfanato
          aws-region: ${{ env.AWS_REGION }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Baseline do Juri (vizinho na mesma EC2)
        run: curl -fsS --connect-timeout 10 --max-time 20 https://api.juri-pilot.com/healthcheck/deep >/dev/null

      - name: Login no ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin $ECR

      - name: Build arm64 e push (tag = SHA do commit)
        run: |
          docker buildx build --platform linux/arm64 -f Dockerfile \
            -t $ECR/$REPO:${{ github.sha }}-arm64 --push .

      - name: Deploy via SSM (env, dump verificado, migrations, troca, readiness, rollback)
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          IMAGE="$ECR/$REPO:${{ github.sha }}-arm64"
          mapfile -t INSTANCES < <(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=super-stack-prod" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text | tr '\t' '\n' | sed '/^$/d')
          test "${#INSTANCES[@]}" -eq 1
          INSTANCE=${INSTANCES[0]}
          REQ_B64=$(base64 -w0 scripts/deploy/required-env.txt)
          SCRIPT_B64=$(base64 -w0 scripts/deploy/remote-deploy.sh)
          CMD="echo $SCRIPT_B64 | base64 -d > /tmp/orfanato-remote-deploy.sh && DRY_RUN=$DRY_RUN REQUIRED_ENV_B64=$REQ_B64 bash /tmp/orfanato-remote-deploy.sh $IMAGE; rc=\$?; rm -f /tmp/orfanato-remote-deploy.sh; exit \$rc"
          CMD_ID=$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$INSTANCE" \
            --timeout-seconds 1800 --comment "deploy-orfanato ${{ github.sha }}" \
            --parameters "commands=[\"$CMD\"]" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
            --query Status --output text | grep -qx Success

      - name: Verificação externa (health via Caddy)
        if: ${{ !inputs.dry_run }}
        run: curl -fsS --retry 5 --retry-delay 5 "$HEALTH_URL"

      - name: Juri depois da tentativa de deploy
        if: ${{ always() }}
        run: curl -fsS --connect-timeout 10 --max-time 20 https://api.juri-pilot.com/healthcheck/deep >/dev/null
